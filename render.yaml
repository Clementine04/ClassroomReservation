services:
  - type: web
    name: classroom-reservation
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python migrate.py && gunicorn app:app
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: classroom_db
          property: connectionString

databases:
  - name: classroom_db
    databaseName: classroom_reservation
    plan: free 